name: SecurityLab CI

# 快速门禁（fast）：lint + 类型检查 + 纯离线单元测试。
#   不需要 vcan0 / root / CAN 硬件，在普通 GitHub runner 上即可运行，
#   对应本地脚本 scripts/qa_fast.sh。
#
# 扩展安全测试（extended）：需要 vcan0 与 can-utils/tshark/yara，
#   对应 scripts/qa_extended.sh。仅在手动 workflow_dispatch 时运行。
#
#   【Runner 能力事实 —— 2026-10-14 实测修正，勿再按旧假设理解】
#   GitHub 托管 runner **默认没有可用的 vcan**：
#       modprobe: FATAL: Module vcan not found in /lib/modules/<ver>
#   原因是托管镜像不安装 linux-modules-extra-<running-kernel>；该内核
#   本身是支持 vcan 的（Ubuntu 官方包库中存在与本内核版本精确匹配的
#   linux-modules-extra 包，且其文件清单含 vcan.ko）。
#   因此本作业在 Bring up vcan0 之前**显式安装** linux-modules-extra。
#
#   【本地环境事实】本地 WSL2 **不是**权威的扩展测试环境：其内核配置
#   为 CONFIG_CAN_VCAN is not set（未编译进内核），无法通过安装
#   linux-modules-extra 补救。权威 vcan 环境待 OQ-2 建立。
#
#   注意：安装成功不等 Extended quality gate 通过；extended 通过也不等于
#   fuzz / repro / 硬件相关测试通过 —— extended 不含 --fuzz，也不含
#   scripts/repro/*。
#
# 长时间 CAN fuzz（30/100/500/1000）不放进 CI：
#   本地用 scripts/qa_extended.sh --fuzz 或 fuzz/isotp_fuzz.py 单独执行。

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_extended:
        description: "运行需要 vcan0 的扩展安全测试"
        type: boolean
        default: true

jobs:
  fast:
    name: Fast QA (ruff + mypy + offline tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r configs/environment/python-network-requirements.txt \
            -r configs/environment/python-dev-requirements.txt

      - name: Fast quality gate
        run: bash scripts/qa_fast.sh

  extended:
    name: Extended security tests (vcan0, manual)
    runs-on: ubuntu-latest
    needs: fast
    if: github.event_name == 'workflow_dispatch' && inputs.run_extended
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 托管 runner 镜像不安装与本内核匹配的 linux-modules-extra，
      # 因此 vcan.ko 不在 /lib/modules/$(uname -r) 下，直接 modprobe 会失败。
      # 步骤顺序有硬依赖：必须先装包，Bring up vcan0 才可能成功。
      - name: Install kernel extra modules (provides vcan)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          KREL="$(uname -r)"
          echo "running kernel: ${KREL}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "linux-modules-extra-${KREL}"
          # 证明模块文件确实就位（安装失败/包缺席时在此 fail-closed）
          test -e "/lib/modules/${KREL}/kernel/drivers/net/can/vcan.ko" \
            -o -e "/lib/modules/${KREL}/kernel/drivers/net/can/vcan.ko.zst"
          echo "vcan module present for ${KREL}"

      # 2026-10-14 实测发现的两个独立前置条件（均由真实运行暴露）：
      #
      #  (1) run 38529912319：vcan.ko 缺失（镜像未装 modules-extra）
      #  (2) run 38536799332：装上后 vcan0 已 UP，但 e2e 仍报
      #          OSError: [Errno 93] Protocol not supported
      #      —— ISO-TP 走 socket(AF_CAN, SOCK_DGRAM, CAN_ISOTP)，
      #      vcan 只是虚拟*设备*驱动，不提供 CAN_ISOTP *协议*。
      #
      #  (3) run 38538604194：本步曾硬写 `modprobe can_isotp` 并 hard-fail，
      #      结果 `Module can_isotp not found`。该模块名因内核版本而异，
      #      也可能被**内建**（=y，根本没有 .ko 可加载）。
      #      ⇒ 因此 modprobe 改为**尽力而为**，真正 fail-closed 的判据是
      #      最后那个真实 socket 构造（协议是否可用，一试便知）。
      - name: Bring up vcan0
        run: |
          set -euo pipefail
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 up
          ip -details link show vcan0

          # CAN 协议模块：名称/是否内建随内核而异，故逐个尝试、允许失败。
          # 常见候选：can(核心) / can_raw(RAW socket) / isotp(CAN_ISOTP 协议)
          for m in can can_raw can_bcm can_gw isotp can-isotp can_isotp; do
            if sudo modprobe "$m" 2>/dev/null; then
              echo "modprobe $m: loaded"
            else
              echo "modprobe $m: not loaded (built-in or absent) - continuing"
            fi
          done

          echo "--- loaded can-related modules ---"
          lsmod | grep -E '^(vcan|can|can_raw|can_bcm|can_gw|isotp|can_isotp)\b' || true

          # fail-closed：以**真实 socket** 判定 CAN_ISOTP 是否可用。
          # 这是权威判据；上面的 modprobe 只是尽力而为的准备动作。
          python3 -c "import socket; s=socket.socket(socket.AF_CAN, socket.SOCK_DGRAM, socket.CAN_ISOTP); s.close(); print('CAN_ISOTP socket OK')"

      - name: Install CAN / capture / YARA tooling
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends can-utils tshark yara

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r configs/environment/python-network-requirements.txt \
            -r configs/environment/python-dev-requirements.txt

      - name: Extended quality gate
        run: bash scripts/qa_extended.sh
